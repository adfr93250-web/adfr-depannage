# Blueprint Render : serveur FastAPI (formulaire de rappel, suivi des clics, admin, alertes email)
services:
  - type: web
    name: adfr-api
    runtime: python
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: adfr
      - key: CORS_ORIGINS
        value: https://adfr-depannage.fr,https://www.adfr-depannage.fr,https://sos-depann.fr,https://www.sos-depann.fr
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: adfr93250@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_NAME
        value: ADFR
      - key: ALERT_EMAIL
        value: adfr93250@gmail.com
      - key: SITE_PUBLIC_URL
        value: https://adfr-depannage.fr
