<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Carte de visite — ?brand=adfr|sos&side=recto|verso</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Carte 85 x 55 mm. Rendu à 1050 x 650 px (zoom 2 → 2100 x 1300 px ≈ 630 dpi). Fond perdu : ajouter 3 mm à l'impression. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1050px; height: 650px; overflow: hidden; }
  body { zoom: 2; }
  .card { position: relative; width: 1050px; height: 650px; overflow: hidden; color: #fff; }

  /* ---------- ADFR ---------- */
  .adfr { background: #050B14; font-family: Inter, sans-serif; }
  .adfr .display { font-family: Montserrat, sans-serif; }
  .adfr .glow { position: absolute; width: 700px; height: 700px; border-radius: 50%; filter: blur(120px); opacity: .55; }
  .adfr .g1 { background: #1E4FD6; top: -320px; right: -200px; }
  .adfr .g2 { background: #E30613; bottom: -420px; left: -220px; opacity: .35; }
  .adfr .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(201,205,212,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(201,205,212,.06) 1px, transparent 1px); background-size: 48px 48px; }
  .adfr .photo { position: absolute; top: 0; right: 0; bottom: 0; width: 62%; object-fit: cover; object-position: 70% 50%; -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.55) 30%, #000 60%); mask-image: linear-gradient(90deg, transparent 0%, rgba(0,0,0,.55) 30%, #000 60%); }
  .adfr .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,11,20,.35) 0%, rgba(5,11,20,0) 35%, rgba(5,11,20,.75) 100%); }
  .adfr .logo { position: absolute; top: 56px; left: 60px; height: 128px; background: #fff; border-radius: 22px; padding: 14px 24px; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
  .adfr .logo img { height: 100%; display: block; }
  .adfr .eyebrow { position: absolute; top: 72px; right: 60px; display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: 700; letter-spacing: .28em; text-transform: uppercase; color: #9DB9F5; }
  .adfr .eyebrow i { width: 12px; height: 12px; border-radius: 50%; background: #E30613; box-shadow: 0 0 18px #E30613; }
  .adfr h1 { position: absolute; left: 60px; top: 232px; font-size: 64px; line-height: .98; font-weight: 900; letter-spacing: -.02em; }
  .adfr h1 span { color: #E30613; }
  .adfr .sub { position: absolute; left: 60px; top: 372px; font-size: 24px; color: #C9CDD4; font-weight: 500; }
  .adfr .phone { position: absolute; left: 60px; bottom: 56px; display: inline-flex; align-items: center; gap: 22px; background: #E30613; color: #fff; padding: 26px 44px 26px 34px; border-radius: 999px; box-shadow: 0 18px 60px rgba(227,6,19,.45); }
  .adfr .phone .ico { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,.18); display: grid; place-items: center; }
  .adfr .phone b { font-size: 58px; letter-spacing: .02em; }
  .adfr .phone small { display: block; font-size: 16px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; opacity: .85; margin-bottom: 4px; }
  .adfr .badge { position: absolute; right: 60px; bottom: 72px; text-align: right; text-shadow: 0 6px 30px rgba(0,0,0,.8); }
  .adfr .badge b { display: block; font-size: 72px; font-weight: 900; line-height: 1; }
  .adfr .badge span { font-size: 18px; letter-spacing: .22em; text-transform: uppercase; color: #C9D6F7; font-weight: 700; }

  .adfr.verso { background: #0A1E4C; }
  .adfr.verso .band { position: absolute; left: 0; top: 0; bottom: 0; width: 330px; background: #E30613; }
  .adfr.verso .band .qr { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); background: #fff; padding: 16px; border-radius: 20px; }
  .adfr.verso .band .qr img { width: 210px; height: 210px; display: block; }
  .adfr.verso .band p { position: absolute; left: 0; right: 0; bottom: 48px; text-align: center; font-size: 15px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
  .adfr.verso .band .top { position: absolute; left: 0; right: 0; top: 48px; text-align: center; font-size: 15px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
  .adfr.verso .content { position: absolute; left: 390px; right: 60px; top: 60px; bottom: 56px; display: flex; flex-direction: column; justify-content: center; padding-bottom: 120px; }
  .adfr.verso h2 { font-size: 40px; font-weight: 900; line-height: 1.05; }
  .adfr.verso h2 span { color: #FF6B75; }
  .adfr.verso ul { margin-top: 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 28px; list-style: none; }
  .adfr.verso li { font-size: 21px; font-weight: 600; color: #E6EAF2; display: flex; gap: 12px; align-items: center; }
  .adfr.verso li::before { content: ""; width: 9px; height: 9px; background: #E30613; border-radius: 50%; flex: none; }
  .adfr.verso .foot { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px solid rgba(201,205,212,.25); padding-top: 22px; }
  .adfr.verso .foot .k { font-size: 14px; letter-spacing: .25em; text-transform: uppercase; color: #9DB9F5; font-weight: 700; margin-bottom: 6px; }
  .adfr.verso .foot .v { font-size: 24px; font-weight: 800; }
  .adfr.verso .foot .v.site { color: #fff; }
  .adfr.verso .zones { margin-top: 26px; font-size: 17px; color: #9DB9F5; font-weight: 600; letter-spacing: .04em; }

  /* ---------- SOS ---------- */
  .sos { background: #120202; font-family: Barlow, sans-serif; }
  .sos .display { font-family: 'Barlow Condensed', sans-serif; }
  .sos .hazard { position: absolute; left: 0; right: 0; height: 26px; background: repeating-linear-gradient(135deg, #FF3030 0 26px, #120202 26px 52px); }
  .sos .hazard.top { top: 0; } .sos .hazard.bot { bottom: 0; }
  .sos .glow { position: absolute; width: 900px; height: 900px; border-radius: 50%; background: #E60000; filter: blur(160px); opacity: .32; right: -400px; top: -300px; }
  .sos .logo { position: absolute; top: 70px; left: 60px; height: 120px; background: #fff; border-radius: 6px; padding: 12px 22px; }
  .sos .logo img { height: 100%; display: block; }
  .sos .eyebrow { position: absolute; top: 84px; right: 60px; border-left: 6px solid #FF3030; padding-left: 16px; font-size: 20px; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: #FF8C8C; }
  .sos h1 { position: absolute; left: 60px; top: 228px; font-size: 118px; line-height: .86; font-weight: 900; text-transform: uppercase; }
  .sos h1 span { color: #E60000; }
  .sos .phone { position: absolute; left: 60px; right: 60px; bottom: 70px; background: #E60000; color: #fff; padding: 24px 40px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 0 70px rgba(230,0,0,.5); }
  .sos .phone small { display: block; font-size: 17px; font-weight: 700; letter-spacing: .32em; text-transform: uppercase; opacity: .85; }
  .sos .phone b { display: block; font-size: 78px; line-height: 1; letter-spacing: .03em; font-weight: 900; }
  .sos .phone .right { text-align: right; }
  .sos .phone .right b { font-size: 44px; }
  .sos .phone .right small { opacity: .9; }

  .sos.verso .content { position: absolute; left: 60px; right: 60px; top: 80px; bottom: 80px; display: grid; grid-template-columns: 1fr 300px; gap: 50px; }
  .sos.verso h2 { font-size: 86px; line-height: .9; font-weight: 900; text-transform: uppercase; }
  .sos.verso h2 span { color: #E60000; }
  .sos.verso ul { margin-top: 30px; list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 26px; }
  .sos.verso li { font-size: 24px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: #F3DADA; display: flex; gap: 12px; align-items: center; }
  .sos.verso li::before { content: ""; width: 14px; height: 4px; background: #FF3030; flex: none; }
  .sos.verso .meta { margin-top: 34px; display: flex; gap: 48px; }
  .sos.verso .meta .k { font-size: 14px; letter-spacing: .28em; text-transform: uppercase; color: #FF8C8C; font-weight: 700; margin-bottom: 6px; }
  .sos.verso .meta .v { font-size: 30px; font-weight: 800; }
  .sos.verso .content > div:first-child { align-self: center; }
  .sos.verso .zones { margin-top: 30px; font-size: 19px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #FF8C8C; }
  .sos.verso .qrbox { background: #fff; padding: 20px; display: grid; place-items: center; align-self: center; border: 6px solid #E60000; }
  .sos.verso .qrbox img { width: 230px; height: 230px; display: block; }
  .sos.verso .qrbox p { margin-top: 12px; color: #120202; font-size: 16px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const p = new URLSearchParams(location.search);
  const brand = p.get("brand") === "sos" ? "sos" : "adfr";
  const side = p.get("side") === "verso" ? "verso" : "recto";
  const qr = (data) => `https://api.qrserver.com/v1/create-qr-code/?size=460x460&margin=0&format=png&color=0a0a0a&bgcolor=ffffff&data=${encodeURIComponent(data)}`;
  const phoneSvg = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`;

  const T = {
    adfr: {
      recto: `<div class="card adfr"><div class="glow g1"></div><div class="glow g2"></div><div class="grid"></div>
        <img class="photo" src="/img/hero-adfr.webp" alt="Dépanneuse ADFR"><div class="shade"></div>
        <div class="logo"><img src="/img/logo-adfr.png" alt="ADFR"></div>
        <div class="eyebrow"><i></i>Urgence 24h/24 — 7j/7</div>
        <h1 class="display">Dépannage &amp;<br>remorquage <span>auto</span></h1>
        <p class="sub">Toute l'Île-de-France · Toutes marques · Paiement sur place</p>
        <a class="phone" href="tel:+33185800061"><span class="ico">${phoneSvg(34)}</span><span><small>Appelez maintenant</small><b class="display">01 85 80 00 61</b></span></a>
        <div class="badge"><b class="display">20<span style="font-size:34px"> min</span></b><span>Arrivée moyenne</span></div>
      </div>`,
      verso: `<div class="card adfr verso">
        <div class="band"><p class="top">Scannez pour appeler</p><div class="qr"><img src="${qr("tel:+33185800061")}" alt="QR appel"></div><p>01 85 80 00 61</p></div>
        <div class="content">
          <h2 class="display">Une panne ?<br><span>On arrive en 20 minutes.</span></h2>
          <ul><li>Remorquage plateau</li><li>Dépannage sur place</li><li>Batterie &amp; démarrage</li><li>Crevaison</li><li>Panne de carburant</li><li>Véhicule accidenté</li></ul>
          <p class="zones">Paris · 92 · 93 · 94 · 95 · 77 · 78 · 91</p>
          <div class="foot">
            <div><div class="k">WhatsApp</div><div class="v">06 52 66 47 49</div></div>
            <div style="text-align:right"><div class="k">Site</div><div class="v site">adfr-depannage.fr</div></div>
          </div>
        </div>
      </div>`,
    },
    sos: {
      recto: `<div class="card sos"><div class="glow"></div><div class="hazard top"></div><div class="hazard bot"></div>
        <div class="logo"><img src="/img/logo-sos.png" alt="SOS Dépannage"></div>
        <div class="eyebrow">Dépanneuse 24h/24</div>
        <h1 class="display">En panne ?<br><span>Appelez.</span></h1>
        <div class="phone"><div><small>Urgence — Île-de-France</small><b class="display">01 84 16 09 23</b></div><div class="right"><small>Arrivée en</small><b class="display">20 MIN</b></div></div>
      </div>`,
      verso: `<div class="card sos verso"><div class="hazard top"></div><div class="hazard bot"></div>
        <div class="content">
          <div>
            <h2 class="display">On arrive.<br><span>Jour &amp; nuit.</span></h2>
            <ul><li>Remorquage</li><li>Dépannage sur place</li><li>Batterie</li><li>Crevaison</li><li>Carburant</li><li>Accident</li></ul>
            <div class="meta">
              <div><div class="k">WhatsApp</div><div class="v display">06 52 66 47 49</div></div>
              <div><div class="k">Site</div><div class="v display">sos-depann.fr</div></div>
            </div>
            <p class="zones">Paris · 92 · 93 · 94 · 95 · 77 · 78 · 91 — Paiement sur place</p>
          </div>
          <div class="qrbox"><img src="${qr("tel:+33184160923")}" alt="QR appel"><p>Scanner = appeler</p></div>
        </div>
      </div>`,
    },
  };
  document.getElementById("root").innerHTML = T[brand][side];
</script>
</body>
</html>
